<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">DVS Workspace</title>
<desc id="desc">Icona DVS Workspace in stile Apple con bagliore blu</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a2d31"/>
    <stop offset="0.55" stop-color="#191c20"/>
    <stop offset="1" stop-color="#101215"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8102e"/>
    <stop offset="1" stop-color="#970018"/>
