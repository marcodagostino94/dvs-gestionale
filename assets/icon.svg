  <path d="M531 185 Q531 151 562 151 H742 Q785 151 808 178 Q824 197 824 229 V736 Q824 768 800 788 Q777 807 747 807 Q710 807 694 768 L531 226 Q531 210 531 185 Z" fill="url(#red)"/>
