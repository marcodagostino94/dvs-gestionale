<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVS Gestionale">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/app.css?v=3.0.0">
  <title>DVS Gestionale</title>
</head>
<body>
  <div id="splash-screen" class="splash-screen">
    <img src="assets/logo-dvs-full.png" alt="Digital Video Service" class="splash-logo">
  </div>

  <section id="login-screen" class="login-screen hidden">
    <div class="login-card glass">
      <img src="assets/logo-dvs-full.png" alt="Digital Video Service" class="login-logo">
      <h1>Gestionale Tecnico</h1>
      <p>Accedi per gestire sale, computer, hardware e licenze.</p>

      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" placeholder="nome@digitalvideo.it">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="Password">
      </div>

      <label class="remember-row">
        <input id="remember-login" type="checkbox" checked>
        <span>Mantieni l'accesso</span>
      </label>

      <button id="login-button" class="primary-button login-main-button">Entra in modalità anteprima</button>
      <button id="biometric-button" class="secondary-button biometric-button" disabled>
        <span class="face-id-symbol">◎</span>
        Face ID / Touch ID — disponibile con il cloud
      </button>
      <p id="login-note" class="login-note">Non servono credenziali in questa fase. Il login sicuro sarà attivato con il database cloud.</p>
    </div>
  </section>

  <div id="app-shell" class="hidden">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <aside class="desktop-sidebar glass">
      <img src="assets/logo-dvs-full.png" alt="Digital Video Service" class="sidebar-logo">
      <nav class="sidebar-nav">
        <button data-view="rooms" class="active"><span class="icon" data-icon="grid"></span><span>Sale</span></button>
        <button data-view="computers"><span class="icon" data-icon="imac"></span><span>Computer</span></button>
        <button data-view="hardware"><span class="icon rec-dot" data-icon="rec"></span><span>Hardware</span></button>
        <button data-view="licenses"><span class="icon" data-icon="key"></span><span>Licenze</span></button>
        <button data-view="summary"><span class="icon" data-icon="summary"></span><span>Sintesi</span></button>
        <button data-view="settings"><span class="icon" data-icon="gear"></span><span>Altro</span></button>
      </nav>
    </aside>
    <div class="desktop-content">
    <header class="topbar glass">
      <div>
        <div class="brand-row">
          <img src="assets/logo-dvs-full.png" alt="Digital Video Service" class="brand-logo-full">
        </div>
        <h1 id="page-title">Sale</h1>
      </div>
      <div class="top-actions">
        <button id="notifications-button" class="round-button" aria-label="Notifiche">
          <span class="icon" data-icon="bell"></span>
          <span id="notification-dot" class="notification-dot"></span>
        </button>
        <button id="add-button" class="round-button primary-round" aria-label="Aggiungi">
          <span class="plus">+</span>
        </button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>

    </div>
    <nav class="tabbar glass" aria-label="Navigazione principale">
      <button data-view="rooms" class="active"><span class="icon" data-icon="grid"></span><small>Sale</small></button>
      <button data-view="computers"><span class="icon" data-icon="imac"></span><small>Computer</small></button>
      <button data-view="hardware"><span class="icon rec-dot" data-icon="rec"></span><small>Hardware</small></button>
      <button data-view="licenses"><span class="icon" data-icon="key"></span><small>Licenze</small></button>
      <button data-view="summary"><span class="icon" data-icon="summary"></span><small>Sintesi</small></button>
      <button data-view="settings"><span class="icon" data-icon="gear"></span><small>Altro</small></button>
    </nav>
  </div>

  <dialog id="modal">
    <div id="modal-content" class="modal-card glass"></div>
  </dialog>

  <dialog id="sheet">
    <div id="sheet-content" class="bottom-sheet glass"></div>
  </dialog>


  <script>
    (function () {
      function revealLogin() {
        var splash = document.getElementById("splash-screen");
        var login = document.getElementById("login-screen");
        if (!splash || !login) return;
        splash.classList.add("splash-exit");
        window.setTimeout(function () {
          splash.classList.add("hidden");
          login.classList.remove("hidden");
          login.classList.add("login-enter");
        }, 450);
      }
      window.__dvsRevealLogin = revealLogin;
      window.setTimeout(revealLogin, 1100);

      window.addEventListener("error", function (event) {
        var note = document.getElementById("login-note");
        if (note) {
          note.textContent = "Errore di caricamento: ricarica la pagina ignorando la cache.";
          note.classList.add("login-error");
        }
      });
    })();
  </script>
  <script type="module" src="js/app.js?v=3.0.0"></script>
</body>
</html>
