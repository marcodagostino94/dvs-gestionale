<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171719">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DVS Gestionale">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/app.css?v=1.1.0">
  <title>DVS Gestionale</title>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header class="topbar glass">
    <div>
      <div class="brand-row">
        <img src="assets/logo-symbol.svg" alt="Digital Video Service" class="brand-logo">
        <span>Digital Video Service</span>
      </div>
      <h1 id="page-title">Sale</h1>
    </div>
    <div class="top-actions">
      <button id="notifications-button" class="round-button" aria-label="Notifiche">
        <span class="icon" data-icon="bell"></span>
        <span id="notification-dot" class="notification-dot"></span>
      </button>
      <button id="add-button" class="round-button primary-round" aria-label="Aggiungi">
        <span class="plus">+</span>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="tabbar glass" aria-label="Navigazione principale">
    <button data-view="rooms" class="active"><span class="icon" data-icon="grid"></span><small>Sale</small></button>
    <button data-view="computers"><span class="icon" data-icon="imac"></span><small>Computer</small></button>
    <button data-view="hardware"><span class="icon rec-dot" data-icon="rec"></span><small>Hardware</small></button>
    <button data-view="licenses"><span class="icon" data-icon="key"></span><small>Licenze</small></button>
    <button data-view="summary"><span class="icon" data-icon="summary"></span><small>Sintesi</small></button>
    <button data-view="settings"><span class="icon" data-icon="gear"></span><small>Altro</small></button>
  </nav>

  <dialog id="modal">
    <div id="modal-content" class="modal-card glass"></div>
  </dialog>

  <script type="module" src="js/app.js?v=1.1.0"></script>
</body>
</html>
